<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3c34d"><title>Meine kleine Baustelle</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f3e8;color:#283e3a;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(24px,4vw,40px);margin:6px 0}small{font-weight:800;letter-spacing:2px;color:#7d7054}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:20px;min-height:52px;padding:14px 20px;color:inherit;background:white;font-weight:750}button:focus-visible{outline:4px solid #234cb5;outline-offset:4px}button:disabled{cursor:default;opacity:.6}.hint{background:#fff;border-radius:22px;padding:18px 24px;margin:20px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.hint h2{margin:0;font-size:clamp(18px,3vw,26px)}.dots{display:flex;gap:8px}.dot{width:22px;height:22px;border-radius:50%;background:#ebe5d8}.dot.done{background:#60aa77}.site{display:block;width:100%;padding:0;overflow:hidden;border:4px solid transparent;background:#e1eff0;border-radius:28px;position:relative}.site.ready{border-color:#efb536}.site svg{display:block;width:100%;height:auto}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.tool{border:3px solid transparent;background:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;box-shadow:0 5px 0 #e5dfd2}.tool.selected{background:#ffedb6;border-color:#e5ac22}.tool span{font-size:38px}.message{min-height:32px;text-align:center;font-size:18px;margin:16px 0}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#736f61}.colors{display:flex;justify-content:center;gap:12px;margin-top:16px}.colors button{color:white;min-width:90px}dialog{border:0;border-radius:24px;padding:28px;max-width:90vw}dialog::backdrop{background:#233c3b80}.working #vehicle{animation:drive 1.2s ease-in-out}.working #dust{animation:dust 1.2s ease-in-out}.celebrate #stars{display:block;animation:pop 1s ease-out}#stars{display:none}@keyframes drive{0%{transform:translateX(-80px)}50%{transform:translateX(20px) rotate(-2deg)}100%{transform:translateX(0)}}@keyframes dust{50%{opacity:.8;transform:translateY(-12px)}100%{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){main{padding:12px}.tool{font-size:14px;flex-direction:column;gap:2px;padding:10px}.hint{padding:14px}.dot{width:14px;height:14px}.footer{font-size:13px}header button{padding:10px}.tools{gap:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main><header><div><small>GRABEN · BAUEN · STAUNEN</small><h1>Meine kleine Baustelle</h1></div><button id="sound" aria-pressed="false">🔇 Ton</button></header><section class="hint"><h2 id="task">Wir bauen ein Haus!</h2><div class="dots" aria-label="Baufortschritt"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></section>
<button class="site" id="site" aria-label="Bauplatz: hier bauen"><svg viewBox="0 0 1000 470" role="img" aria-label="Bunte Baustelle mit einem Haus im Bau"><defs><pattern id="bricks" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#f2bb82"/><path d="M0 0H60M0 30H60M30 0V30" stroke="#fff0ca" stroke-width="3"/></pattern></defs><rect width="1000" height="470" fill="#d9edf0"/><circle cx="854" cy="73" r="36" fill="#ffe29a"/><g fill="white" opacity=".8"><rect x="100" y="68" width="150" height="30" rx="15"/><circle cx="146" cy="65" r="25"/><circle cx="190" cy="65" r="32"/></g><path d="M0 246Q180 160 350 230T680 205T1000 220V470H0" fill="#a9c89b"/><rect y="290" width="1000" height="180" fill="#ddc39b"/><path d="M0 418H1000" stroke="#edd9b8" stroke-width="46"/>
<g><rect x="76" y="230" width="12" height="83" fill="#99754e"/><circle cx="81" cy="209" r="47" fill="#76a579"/><circle cx="109" cy="220" r="30" fill="#76a579"/><rect x="925" y="235" width="12" height="78" fill="#99754e"/><circle cx="930" cy="204" r="45" fill="#76a579"/></g>
<ellipse cx="550" cy="356" rx="219" ry="33" fill="#b89a78" opacity=".4"/><g id="plot"><path d="M350 338L410 299H730L785 338L727 376H404Z" fill="#c2a47f" stroke="#fff4c9" stroke-width="5" stroke-dasharray="13 10"/></g><g id="pit" hidden><path d="M355 335L413 300H729L780 335L722 370H412Z" fill="#886c52"/><path d="M413 314H724L750 335H387Z" fill="#6f5645"/></g><g id="foundation" hidden><path d="M382 333L421 308H712L752 333L712 353H421Z" fill="#cbd0cc"/><path d="M382 333V352L421 374H712L752 351V333L712 353H421Z" fill="#a5afaa"/></g><g id="walls" hidden><rect x="422" y="206" width="291" height="139" rx="5" fill="url(#bricks)"/><rect x="462" y="235" width="52" height="51" rx="5" fill="#97ccda" stroke="#fff3d1" stroke-width="8"/><path d="M488 237V284M464 260H514" stroke="#fff3d1" stroke-width="5"/><rect x="621" y="235" width="52" height="51" rx="5" fill="#97ccda" stroke="#fff3d1" stroke-width="8"/><rect x="544" y="268" width="45" height="77" rx="7" fill="#97704e"/><circle cx="578" cy="310" r="3" fill="#ffd971"/></g><g id="roof" hidden><path id="roofPaint" d="M399 211L568 112L735 211Z" fill="#bc7360"/><path d="M399 211H735" stroke="#805342" stroke-width="10" stroke-linecap="round"/></g><g id="finished" hidden><path d="M541 346L596 346L631 401H509Z" fill="#f2e7cc"/><g fill="#f8d765"><circle cx="430" cy="356" r="8"/><circle cx="702" cy="356" r="8"/></g><g transform="translate(655 319)"><circle cy="-17" r="10" fill="#e8b38e"/><path d="M-12-22Q0-43 12-22Z" fill="#f6cc47"/><rect x="-9" y="-5" width="18" height="24" rx="6" fill="#608a9a"/><path d="M-6 19L-8 35M6 19L8 35M9 0L24-13" stroke="#4d655e" stroke-width="5" stroke-linecap="round"/></g></g>
<g id="vehicle" transform="translate(0 0)"><g id="machine" transform="translate(160 284)"></g></g><g id="dust" fill="#f7deae" opacity="0"><circle cx="310" cy="340" r="22"/><circle cx="338" cy="333" r="18"/></g><g fill="#e87948"><path d="M315 388L329 348L343 388Z"/><path d="M805 388L819 348L833 388Z"/></g><g id="stars" fill="#ffd154" font-size="45"><text x="350" y="150">★</text><text x="740" y="145">★</text><text x="610" y="85">★</text></g><rect x="24" y="24" width="149" height="35" rx="17" fill="#fff9e8"/><text x="42" y="47" font-size="17" fill="#6d7059" font-family="system-ui">BAUPLATZ 01</text></svg></button>
<nav class="tools" aria-label="Fahrzeuge"><button class="tool" data-tool="bagger"><span>🚜</span>Bagger</button><button class="tool" data-tool="laster"><span>🚚</span>Lastwagen</button><button class="tool" data-tool="kran"><span>🏗️</span>Kran</button></nav><section id="colors" class="colors" hidden aria-label="Dachfarbe"><button data-color="rot" style="background:#c66553">Rot</button><button data-color="blau" style="background:#528ba5">Blau</button><button data-color="gruen" style="background:#6c9968">Grün</button></section><p class="message" id="message" role="status" aria-live="polite">Wähle den Bagger. Dann tippe auf den Bauplatz.</p><div class="footer"><span id="save">Dein Fortschritt wird automatisch gespeichert.</span><button id="reset">↻ Neu bauen</button></div><dialog id="confirm"><h2>Noch ein Haus bauen?</h2><p>Dein aktuelles Haus wird zurückgesetzt.</p><button id="cancel">Zurück</button> <button id="confirmReset">Neu bauen</button></dialog></main><script type="module">
const steps = ['bagger','laster','kran','kran'];
const initial = () => ({version:1,step:0,roof:null});
function restore(raw) { try {const s=JSON.parse(raw);return s?.version===1 && Number.isInteger(s.step) && s.step>=0 && s.step<=4 && [null,'rot','blau','gruen'].includes(s.roof) && (!s.roof || s.step===4) ? s : initial();} catch {return initial();} }
function act(state,tool) { return state.step<4 && steps[state.step]===tool ? {...state,step:state.step+1} : state; }
function paint(state,color) {return state.step===4 && ['rot','blau','gruen'].includes(color) ? {...state,roof:color}:state;}

const $=s=>document.querySelector(s), key='kleine-baustelle-v1';
let state=initial(),selected=null,busy=false,sound=false,audio;
try{state=restore(localStorage.getItem(key));}catch{$('#save').textContent='Speichern ist in diesem Browser nicht verfügbar.';}
const tasks=['Grabe die Baugrube.','Bringe die Bausteine.','Baue die Wände.','Setze das Dach auf.','Wähle deine Dachfarbe.'];
const names={bagger:'Bagger',laster:'Lastwagen',kran:'Kran'};
const graphics={bagger:'<rect x="0" y="45" width="146" height="29" rx="14" fill="#485a55"/><circle cx="25" cy="60" r="8" fill="#98a49d"/><circle cx="121" cy="60" r="8" fill="#98a49d"/><rect x="22" y="5" width="75" height="44" rx="8" fill="#efba37"/><rect x="36" y="-29" width="52" height="43" rx="7" fill="#f4c54a"/><rect x="43" y="-22" width="35" height="29" rx="3" fill="#83bac4"/><path d="M95 20L142-39L179 7" fill="none" stroke="#efba37" stroke-width="15" stroke-linejoin="round"/><path d="M170 4L195 15L186 41L160 25Z" fill="#7f7251"/>',laster:'<rect x="0" y="-22" width="110" height="65" rx="7" fill="#d47b53"/><rect x="112" y="0" width="54" height="44" rx="7" fill="#e9b738"/><rect x="124" y="5" width="29" height="22" rx="3" fill="#9bd2da"/><rect x="0" y="37" width="168" height="12" fill="#627569"/><circle cx="28" cy="50" r="17" fill="#40534e"/><circle cx="140" cy="50" r="17" fill="#40534e"/><path d="M10-23H100" stroke="#9d674d" stroke-width="12"/>',kran:'<rect y="40" width="160" height="25" rx="10" fill="#485a55"/><rect x="22" y="5" width="89" height="39" rx="6" fill="#efba37"/><rect x="26" y="-28" width="47" height="39" rx="5" fill="#efba37"/><rect x="33" y="-21" width="30" height="27" fill="#83bac4"/><path d="M96 12L143-108L222-108" fill="none" stroke="#e5ae2c" stroke-width="13" stroke-linejoin="round"/><path d="M217-107V-32Q234-13 215-10" fill="none" stroke="#56685c" stroke-width="4"/>'};
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{$('#save').textContent='Speichern ist in diesem Browser nicht verfügbar.';}}
function tone(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(440,audio.currentTime);o.frequency.linearRampToValueAtTime(660,audio.currentTime+.18);g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.25);o.start();o.stop(audio.currentTime+.25);}catch{}}
function render(){ $('#task').textContent=state.roof?'Dein Haus ist fertig!':tasks[state.step];document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('done',i<state.step));for(const [id,visible]of Object.entries({plot:state.step===0,pit:state.step===1,foundation:state.step>=2,walls:state.step>=3,roof:state.step>=4,finished:!!state.roof})){$('#'+id).style.display=visible?'':'none';$('#'+id).removeAttribute('hidden');}$('#roofPaint').setAttribute('fill',({rot:'#c66553',blau:'#528ba5',gruen:'#6c9968'})[state.roof]||'#bc7360');$('#colors').hidden=state.step!==4||!!state.roof;$('#colors').style.display=$('#colors').hidden?'none':'flex';document.querySelectorAll('[data-tool]').forEach(b=>{b.disabled=busy||state.step===4;b.classList.toggle('selected',b.dataset.tool===selected);b.setAttribute('aria-pressed',String(b.dataset.tool===selected));});$('#site').disabled=busy||state.step===4;$('#site').classList.toggle('ready',!!selected&&state.step<4);$('#reset').disabled=busy;document.querySelectorAll('[data-color]').forEach(b=>b.disabled=busy);$('#machine').innerHTML=graphics[selected||steps[Math.min(state.step,3)]];$('#site').setAttribute('aria-label',busy?'Fahrzeug arbeitet':selected?'Bauplatz: mit '+names[selected]+' bauen':'Bauplatz: zuerst ein Fahrzeug auswählen');}
function hint(){ $('#message').textContent=state.roof?'Geschafft! Jemand ist in dein Haus eingezogen.':state.step===4?'Welche Farbe soll dein Dach haben?':'Wähle den '+names[steps[state.step]]+'. Dann tippe auf den Bauplatz.';}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{if(busy)return;selected=b.dataset.tool;render();$('#message').textContent='Tippe auf den Bauplatz.';});
$('#site').onclick=()=>{if(busy||state.step===4)return;if(!selected){hint();return;}const next=act(state,selected);if(next===state){$('#message').textContent='Hier hilft dir der '+names[steps[state.step]]+'. Versuche es noch einmal.';return;}busy=true;render();$('#site').classList.add('working');$('#message').textContent='Der '+names[selected]+' arbeitet …';tone();setTimeout(()=>{state=next;selected=null;busy=false;$('#site').classList.remove('working');save();render();hint();},1200);};
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{state=paint(state,b.dataset.color);save();render();hint();$('#site').classList.add('celebrate');tone();});
$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 Ton':'🔇 Ton';$('#sound').setAttribute('aria-pressed',String(sound));tone();};$('#reset').onclick=()=>$('#confirm').showModal();$('#cancel').onclick=()=>$('#confirm').close();$('#confirmReset').onclick=()=>{state=initial();selected=null;$('#site').classList.remove('celebrate');$('#confirm').close();save();render();hint();};render();hint();

</script></body></html>
