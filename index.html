t}#stars{display:none}@keyframes drive{0%{transform:translateX(-80px)}50%{transform:translateX(20px) rotate(-2deg)}100%{transform:translateX(0)}}@keyframes dust{50%{opacity:.8;transform:translateY(-12px)}100%{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){main{padding:12px}.tool{font-size:14px;flex-direction:column;gap:2px;padding:10px}.hint{padding:14px}.dot{width:14px;height:14px}.footer{font-size:13px}header button{padding:10px}.tools{gap:8px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
